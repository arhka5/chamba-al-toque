name: Probar fuentes desde GitHub

# Diagnóstico manual: qué portales del Estado responden a los servidores de
# GitHub (SERVIR bloquea estas IP con 403). No guarda ni publica nada.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar cada fuente (una petición por URL)
        run: |
          UA="ChambaAlToqueBot/1.0 (+https://github.com/arhka5/chamba-al-toque)"
          while read -r nombre url; do
            [ -z "$nombre" ] && continue
            res=$(curl -s -o /tmp/r -w "%{http_code} %{size_download} %{time_total}" -A "$UA" -L --max-time 40 "$url" || echo "ERR 0 0")
            printf "%-28s %s\n" "$nombre" "$res"
            sleep 2
          done <<'EOF'
          servir-talento-v1 https://app.servir.gob.pe/DifusionOfertasExterno/faces/consultas/ofertas_laborales.xhtml
          servir-talento-v2-api https://api1pngd.servir.gob.pe/convocatoria/api/public/v1/maestraDetalle?codcabecera=TBL_REGIMEN
          servir-web https://www.servir.gob.pe/
          gobpe-convocatoria https://www.gob.pe/institucion/regionsanmartin-diresa/informes-publicaciones/8721608-convocatoria-cas-n-07-2026-grsm-diresa
          gobpe-busqueda https://www.gob.pe/busquedas?contenido[]=informes-publicaciones&term=convocatoria+cas
          pj-repositorio https://aplicativo.pj.gob.pe/repositoriopsep/15214_AnuncioConvocatoria.pdf
          minjus-convocatorias https://convocatoria.minjus.gob.pe/convocatoria/public/index.xhtml
          empleosperu-mtpe https://mtpe-candidatos.empleosperu.gob.pe/search-jobs/description?jobId=fe8f617c2b3449d19f24beec044d51c7
          munimolina-pdf https://portal.munimolina.gob.pe/nor_legales/otros/cas/cas_files/2026/10/10_Bases_Generales_de_la_Convocatoria_N___009-2026_1792589931.pdf
          EOF
