name: Probar fuentes desde GitHub

# Diagnóstico manual: qué portales del Estado responden a los servidores de
# GitHub (SERVIR bloquea estas IP con 403). No guarda ni publica nada.
on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Consultar cada fuente (una petición por URL)
        run: |
          UA="Mozilla/5.0 (compatible; TocaBot/1.0)"
          while read -r nombre url; do
            [ -z "$nombre" ] && continue
            res=$(curl -s -o /tmp/r -w "%{http_code} %{size_download} %{time_total}" -A "$UA" -L --max-time 40 "$url" || echo "ERR 0 0")
            printf "%-28s %s\n" "$nombre" "$res"
            sleep 2
          done <<'EOF'
          servir-talento-v1 https://app.servir.gob.pe/DifusionOfertasExterno/faces/consultas/ofertas_laborales.xhtml
          servir-practicas https://app.servir.gob.pe/DifusionOfertasExterno/faces/consultas/modalidades_formativas.xhtml
          pluz-cortes https://www.pluz.pe/es/ayuda/enterate-de-los-cortes-de-luz-programados.html
          luzdelsur-cortes https://www.luzdelsur.pe/es/corteluz
          sedapal-interrupciones https://www.sedapal.com.pe/paginas/interrupciones-de-servicio
          facilito-buscador https://www.facilito.gob.pe/facilito/pages/facilito/buscadorEESS.jsp
          facilito-automotor https://www.facilito.gob.pe/facilito/actions/PreciosCombustibleAutomotorAction.do?method=inicio
          digemid-opm-web https://opm-digemid.minsa.gob.pe/
          digemid-opm-api https://ms-opm.minsa.gob.pe/msopmcovid/
          datosabiertos https://www.datosabiertos.gob.pe/
          EOF
