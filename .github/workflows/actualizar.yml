name: Actualizar ofertas y publicar

on:
  schedule:
    # 00:30 de Lima (UTC-5): las ofertas que cerraron ayer salen del sitio
    # apenas vencen. 13:00 de Lima: recoge lo que las entidades publican de día.
    - cron: "30 5 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      solo_publicar:
        # SERVIR bloquea las IP de GitHub (403): herramientas/actualizar_desde_pc.py
        # scrapea desde casa, sube ofertas.json a "data" y lanza esto en true.
        description: "No scrapear: publicar con los datos de la rama data"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["scraper/**", "site/**", "data/**", ".github/workflows/actualizar.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: actualizar
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2  # para saber qué cambió en un push

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas
        run: |
          python -m pytest -q scraper/tests
          cd site && python -m pytest -q

      - name: Datos anteriores (rama "data")
        run: |
          mkdir -p out
          if git fetch --depth=1 origin data:data 2>/dev/null; then
            git show data:ofertas.json > previous.json || echo '{}' > previous.json
            git show data:state.json > out/state.json || echo '{}' > out/state.json
          else
            echo '{}' > previous.json
            echo '{}' > out/state.json
          fi

      - name: Descargar ofertas de Talento Perú
        # Un push que solo cambia la web no vuelve a scrapear: reutiliza los datos.
        run: |
          if [ "${{ inputs.solo_publicar }}" = "true" ] && [ "$(cat previous.json)" != "{}" ]; then
            cp previous.json out/ofertas.json
          elif [ "${{ github.event_name }}" = "push" ] && [ "$(cat previous.json)" != "{}" ] \
             && ! git diff --name-only HEAD~1 HEAD | grep -q '^scraper/'; then
            cp previous.json out/ofertas.json
          else
            python -m scraper --previous previous.json --output out/ofertas.json --max-detalles 1500
          fi

      - name: Generar el sitio
        # Si SERVIR trajo menos de la mitad de ofertas que la vez anterior,
        # build.py termina con error y no se publica ni se guardan los datos.
        run: python site/build.py --data out/ofertas.json --state out/state.json --out public

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Anunciar las nuevas en el canal de Telegram
        # Después de publicar, para que los enlaces ya funcionen. Si falla, el sitio
        # igual queda publicado y esas ofertas se anuncian en la próxima corrida.
        continue-on-error: true
        run: python herramientas/telegram.py out/telegram.json out/state.json
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}

      - name: Guardar datos en la rama "data"
        # Un solo commit que reemplaza al anterior: el historial no crece.
        run: |
          mkdir -p data-branch && cp out/ofertas.json out/state.json data-branch/
          cd data-branch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ofertas.json state.json
          git commit -q -m "Ofertas $(TZ=America/Lima date '+%Y-%m-%d %H:%M')"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
